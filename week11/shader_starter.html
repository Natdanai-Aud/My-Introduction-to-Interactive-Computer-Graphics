<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shader Starter • three.js r128</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    canvas {
      display: block;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>

<body>
  <script>
    // Scene / Camera / Renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(
      60,
      innerWidth / innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 0, 2.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    // ค่าที่ส่งจาก JavaScript เข้า shader
    const uniforms = {
      uTime: { value: 0.0 },
      uLightDir: { value: new THREE.Vector3(0.4, 1.0, 0.8).normalize() },
      uCameraPos: { value: camera.position }
    };

    const vertexShader = `
    uniform float uTime;
    varying vec3 vNormal;
    varying vec2 vUv;
    varying vec3 vPosW;

    void main() {
      vUv = uv;
      vNormal = normal;
      vPosW = position;
      vec3 pos = position;

      pos.z += sin(pos.x * 5.0 + uTime) * 0.1;

      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }
  `;

    const fragmentShader = `
    precision mediump float;

    uniform float uTime;
    uniform vec3 uLightDir;
    uniform vec3 uCameraPos;

    varying vec3 vNormal;
    varying vec2 vUv;
    varying vec3 vPosW;

    

    void main() {

      // เริ่มเขียน fragment shader ที่นี่
      //vec3 color = vec3(vUv, 0.5);

      vec3 N = normalize(vNormal);
      vec3 L = normalize(uLightDir);

      //ambient
      float ambient = 0.5;
      //float diffuse = dot(vNormal, uLightDir);
      float diffuse = max(dot(N,L),0.0);

      //phong specular
      vec3 R = reflect(-L, N);
      vec3 V = normalize(uCameraPos - vPosW);
      float specular = pow(max(dot(R, V), 0.0), 64.0);


      vec3 baseColor = vec3(0.0, 0.5, 1.0);

      vec3 color = (baseColor * (ambient + diffuse)) + vec3(specular*0.5);
      gl_FragColor = vec4(color, 1.0);
    }
  `;

    // ใช้ segment หลายช่อง เพื่อให้ vertex shader ดัดรูปทรงได้ละเอียด
    //const geometry = new THREE.PlaneBufferGeometry(1.5, 1.5, 32, 32);
    const geometry = new THREE.SphereBufferGeometry(0.8, 32, 32);
    const material = new THREE.ShaderMaterial({
      vertexShader,
      fragmentShader,
      uniforms,
      side: THREE.DoubleSide
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });

    function animate(time) {
      uniforms.uTime.value = time * 0.001;
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>

</html>
