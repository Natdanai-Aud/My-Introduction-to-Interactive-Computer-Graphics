style="width:500px; height:500px; border:1px solid #000; image-rendering: pixelated;">
</canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const imageData = ctx.createImageData(canvas.width, canvas.height);
const pixels = imageData.data; // Array of color [R,G,B,A, R,G,B,A, ...]

function putPixel(x, y, r, g, b, a = 255) {
  const idx = (y * canvas.width + x) * 4; // หา index แรกของ pixel (x,y)
  pixels[idx] = r;
  pixels[idx + 1] = g;
  pixels[idx + 2] = b;
  pixels[idx + 3] = a;
}

function drawLine(x1, y1, x2, y2, r, g, b, a = 255) {
  const dx = Math.abs(x2 - x1);
  const dy = Math.abs(y2 - y1);

  if(dx > dy) {
    const m = (y2 - y1) / (x2 - x1);
    const c = y1 - m * x1;
    for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
      const y = Math.round(m * x + c);
      putPixel(x, y, r, g, b, a);
    }
  } else {
    const m = (x2 - x1) / (y2 - y1);
    const c = x1 - m * y1;
    for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
      const x = Math.round(m * y + c);
      putPixel(x, y, r, g, b, a);
    }
  }
}

function drawRect(x1, y1, x2, y2, r, g, b, a = 255) {
  drawLine(x1, y1, x2, y1, r, g, b, a); // Top edge
  drawLine(x2, y1, x2, y2, r, g, b, a); // Right edge
  drawLine(x2, y2, x1, y2, r, g, b, a); // Bottom edge
  drawLine(x1, y2, x1, y1, r, g, b, a); // Left edge
}

function drawRectFilled(x1, y1, x2, y2, r, g, b, a = 255) {
  for (let y = y1; y <= y2; y++) {
    for (let x = x1; x <= x2; x++) {
      putPixel(x, y, r, g, b, a);
    }
  }
}

function drawRectGradient(x1, y1, x2, y2, r1, g1, b1, r2, g2, b2) {
  for (let y = y1; y <= y2; y++) {
    const t = (y - y1) / (y2 - y1);
    const r = Math.round(r1 * (1 - t) + r2 * t);
    const g = Math.round(g1 * (1 - t) + g2 * t);
    const b = Math.round(b1 * (1 - t) + b2 * t);
    for (let x = x1; x <= x2; x++) {
      putPixel(x, y, r, g, b);
    }
  }
}

function drawEllipse(cx, cy, rx, ry, r, g, b, a = 255) {
  for (let y = -ry; y <= ry; y++) {
    for (let x = -rx; x <= rx; x++) {
      if ((x * x) / (rx * rx) + (y * y) / (ry * ry) <= 1) {
        putPixel(cx + x, cy + y, r, g, b, a);
      }
    }
  }
}

function drawSprite(sprite, x, y, r, g, b, a = 255) {
  for (let j = 0; j < sprite.length; j++) {
    for (let i = 0; i < sprite[j].length; i++) {
      if (sprite[j][i] === 1) {
        putPixel(x + i, y + j, r, g, b, a);
      }
    }
  }
}



function toScaledMousePos(posX, posY) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: Math.floor((posX - rect.left) * scaleX),
    y: Math.floor((posY - rect.top) * scaleY)
  };
}

let isDragging = false; 
let previousX = 0;
let previousY = 0;
let r = 0, g = 0, b = 0, a = 255; // Default color
let startX = 0, startY = 0; // Starting position for drawing shapes
let currentMode = 'pencil'; // Default drawing mode
let size = 1; // Default brush size

canvas.addEventListener('click', (event) => {

});

canvas.addEventListener('mousedown', (event) => {
  isDragging = true;
  
  const pos = toScaledMousePos(event.clientX, event.clientY);
  startX = pos.x;
  startY = pos.y;

  previousX = pos.x;
  previousY = pos.y;


  if(currentMode === 'pencil') {
    for (let i = 0; i < size; i++) {
      for (let j = 0; j < size; j++) {
        putPixel(pos.x + i, pos.y + j, r, g, b);
      }
    }
    ctx.putImageData(imageData, 0, 0);
  }
  else if(currentMode === 'eraser') {
    for (let i = 0; i < size; i++) {
      for (let j = 0; j < size; j++) {
        putPixel(pos.x + i, pos.y + j, 255, 255, 255); // Erase with white color
      }
    }
    ctx.putImageData(imageData, 0, 0);
  }
});

canvas.addEventListener('mouseup', (event) => {
  if(!isDragging) return;
  isDragging = false;

const { x: endX, y: endY } = toScaledMousePos(event.clientX, event.clientY);

  if(currentMode === 'line') {
    const dx = Math.abs(endX - startX);
    const dy = Math.abs(endY - startY);
    if(dx > dy) {
      const m = (endY - startY) / (endX - startX);
      const c = startY - m * startX;
      for (let x = Math.min(startX, endX); x <= Math.max(startX, endX); x++) {
        const y = Math.round(m * x + c);
        for (let i = 0; i < size; i++) {
          for (let j = 0; j < size; j++) {
            putPixel(x + i, y + j, r, g, b);
          }
        }
      }
    } else {
      const m = (endX - startX) / (endY - startY);
      const c = startX - m * startY;
      for (let y = Math.min(startY, endY); y <= Math.max(startY, endY); y++) {
        const x = Math.round(m * y + c);
        for (let i = 0; i < size; i++) {
          for (let j = 0; j < size; j++) {
            putPixel(x + i, y + j, r, g, b);
          }
        }
      }
    }
    //drawLine(startX, startY, endX, endY, r, g, b);
  } else if(currentMode === 'rect') {
    drawRect(startX, startY, endX, endY, r, g, b);
  } else if(currentMode === 'rectFilled') {
    drawRectFilled(startX, startY, endX, endY, r, g, b);
  } else if(currentMode === 'rectGradient') {
    drawRectGradient(startX, startY, endX, endY, r, g, b, 255 - r, 255 - g, 255 - b);
  } else if(currentMode === 'ellipse') {
    const rx = Math.abs(endX - startX) / 2;
    const ry = Math.abs(endY - startY) / 2;
    const cx = (startX + endX) / 2;
    const cy = (startY + endY) / 2;
    drawEllipse(cx, cy, rx, ry, r, g, b);
  }

  ctx.putImageData(imageData, 0, 0); // Update the canvas with the new image data
});

canvas.addEventListener('mousemove', (event) => {
  if(!isDragging) return;
  const { x, y } = toScaledMousePos(event.clientX, event.clientY);

  if(currentMode === 'pencil') {
    //drawLine(previousX, previousY, x, y, r, g, b); // Draw a line from previous position to current position with the current color
    for (let i = 0; i < size; i++) {
      for (let j = 0; j < size; j++) {
        drawLine(previousX, previousY, x + i, y + j, r, g, b);
      }
    }
    //putPixel(x, y, r, g, b); // Draw a pixel at current position with the current color
    ctx.putImageData(imageData, 0, 0);
  }
  else if(currentMode === 'eraser') {
    for (let i = 0; i < size; i++) {
      for (let j = 0; j < size; j++) {
        drawLine(previousX, previousY, x + i, y + j, 255, 255, 255); // Erase with white color
      }
    }
    
    //drawLine(previousX, previousY, x, y, 255, 255, 255); // Erase with white color
    ctx.putImageData(imageData, 0, 0);
  }
  previousX = x;
  previousY = y;
});
