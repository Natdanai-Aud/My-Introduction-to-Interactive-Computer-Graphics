<!DOCTYPE html>
<html>

<head>
    <title>GPU</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>

        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();


        const camera = new THREE.PerspectiveCamera(
            65,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(2, 3, 2);
        camera.lookAt(0, 0, 0);




        const axesHelper = new THREE.AxesHelper(5);
        scene.add(axesHelper);


        /* Auto-exported from Blender */
        const vertices = [
            1.0, 0.0, 1.0, -1.0, 0.0, -1.0, -1.0, 0.0, 1.0, 1.0, 0.0, 1.0, 1.0, 0.0, -1.0, -1.0, 0.0, -1.0
        ];

        const uvs = [
            1.0, 0.5, 0.5, 1.0, 0.5, 0.5, 1.0, 0.5, 1.0, 1.0, 0.5, 1.0
        ];




        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
        geometry.computeVertexNormals();


        const myObj = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({
        }));
        myObj.position.set(0, 0, 0);
        myObj.castShadow = true;
        scene.add(myObj);

        //Light
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(1, 1, 1);
        scene.add(light);


        const loader = new THREE.OBJLoader();
        loader.load("https://sibsansuk.github.io/courses/3dmodel/reaper.obj", function (obj) {
            obj.position.set(1, 0, 0);
            scene.add(obj);
        });


        const controls = new THREE.OrbitControls(camera, renderer.domElement);




        function animate(t) {

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate(0);



    </script>
</body>

</html>
