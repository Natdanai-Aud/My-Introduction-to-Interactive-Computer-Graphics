<!DOCTYPE html>
<html>

<head>
    <title>Interactive-3D-Portfolio</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <!-- core three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>

        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Shadow
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();


        const camera = new THREE.PerspectiveCamera(
            20,
            window.innerWidth / window.innerHeight,
            0.5,
            1000
        );
        camera.position.set(5, 2, 5);
        camera.lookAt(0, 0, 0);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

  
        const hemisphereLight = new THREE.HemisphereLight(0xffffff, 0x888888, 0.45);
        scene.add(hemisphereLight);

        const pointLight = new THREE.PointLight(0xffffff, 2);
        pointLight.position.set(0, 2, 0);
        pointLight.castShadow = true;
        scene.add(pointLight);

        const fillLight = new THREE.PointLight(0xfff0dd, 1.5);
        fillLight.position.set(2, 1.5, 2);
        scene.add(fillLight);
        

        

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 10, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

       


        scene.background = new THREE.Color(0xffffff);

        // Projector screen content - one action per language
        const screenTextures = { th: null, en: null };
        let screenMesh = null;

        function loadScreenTexture(path, onLoad) {
            new THREE.TextureLoader().load(path, (texture) => {
                texture.encoding = THREE.sRGBEncoding;
                texture.flipY = false; // GLB UVs already use glTF's top-left origin
                texture.generateMipmaps = false; // 1920x1080 is not power-of-two
                texture.minFilter = THREE.LinearFilter;
                texture.wrapS = THREE.ClampToEdgeWrapping;
                texture.wrapT = THREE.ClampToEdgeWrapping;
                texture.needsUpdate = true;
                onLoad(texture);
            });
        }

        function actionThai() {
            if (!screenMesh || !screenTextures.th) return;
            screenMesh.material.map = screenTextures.th;
            screenMesh.material.emissiveMap = screenTextures.th;
            screenMesh.material.emissive = new THREE.Color(0xffffff);
            screenMesh.material.emissiveIntensity = 0.4;
            screenMesh.material.needsUpdate = true;
            console.log('Screen: Thai');
        }

        function actionEnglish() {
            if (!screenMesh || !screenTextures.en) return;
            screenMesh.material.map = screenTextures.en;
            screenMesh.material.emissiveMap = screenTextures.en;
            screenMesh.material.emissive = new THREE.Color(0xffffff);
            screenMesh.material.emissiveIntensity = 0.4;
            screenMesh.material.needsUpdate = true;
            console.log('Screen: English');
        }

        loadScreenTexture('screen/TH.png', (t) => { screenTextures.th = t; actionThai(); });
        loadScreenTexture('screen/EN.png', (t) => { screenTextures.en = t; });

        // Load Room.glb model
        const loader = new THREE.GLTFLoader();
        loader.load('Model/Room.glb', (gltf) => {
            const roomModel = gltf.scene;

            // Auto-center & scale to fit the view
            const box = new THREE.Box3().setFromObject(roomModel);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 2.5 / maxDim;
            roomModel.scale.setScalar(scale);
            roomModel.position.sub(center.multiplyScalar(scale));

            roomModel.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            screenMesh = roomModel.getObjectByName('Screen_Surface');
            if (screenMesh) {
                // default language; also applies the texture if it finished loading after the GLB
                actionThai();
            } else {
                console.error('Screen_Surface not found in Model/Room.glb');
            }

            scene.add(roomModel);
            console.log('Model loaded: Model/Room.glb');
        }, undefined, (error) => {
            console.error('Error loading Model/Room.glb:', error);
        });

        function animate(t) {
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate(0);

        window.addEventListener('keydown', (event) => {
            const key = event.key.toLowerCase();
            if (key === 't') actionThai();
            if (key === 'e') actionEnglish();
        });

    </script>
</body>

</html>
